# @package _global_
# Та же цель, что у `smollm_flow_selfcorrect`, но обучаются Q, K, V — БЕЗ O.
#
# Это набор оригинальной статьи. Наши конфиги добавляют к нему `o_proj`, и
# обоснование в докстринге адаптера («официальная реализация не разделяет
# выходную проекцию с AR») ссылки не имеет — в репозитории заимствована только
# маска (`generate_dual_pass_mask`), не список обучаемых проекций.
#
# Цена вопроса на SmolLM2-135M: `o_proj` — 9.95М из 26.54М, то есть 37.5% головы
# и самая крупная её часть наравне с `q_proj`. Если добавление сделано зря, все
# руки, включая маскирующий бейзлайн, несут на треть больше обучаемых параметров,
# чем Orthrus, — тогда наш «бейзлайн» сильнее опубликованного, и утверждение
# «сравнились с Orthrus» требует оговорки.
#
# Роль `o_proj` отличается от Q и K качественно: Q и K перевешивают внимание
# внутри геометрии, уже заданной двухпроходной маской, а `o_proj` СВОДИТ признаки
# многоголового внимания — то есть меняет, что именно выходит наружу.
#   uv run python src/train.py +experiment=smollm_flow_selfcorrect_qkv
defaults:
  - /experiment/smollm_flow_selfcorrect
  - _self_

output_dir: checkpoints/smollm-flow-selfcorrect-qkv
model:
  adapter:
    w_names: [q_proj, k_proj, v_proj]
