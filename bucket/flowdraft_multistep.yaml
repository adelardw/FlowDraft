# @package _global_
# The preset where multi-step is actually TRAINED.
#
# What was wrong with every run so far, stated plainly: the dominant term,
# verify_kl at weight 1.0, is evaluated at the pair (s, t) = (0, 1). That is the
# ONE-jump map. A schedule of n > 1 jumps executes a composition that no term
# in the objective ever looked at end to end, and the two knobs that could have
# supervised it were both switched off:
#
#   rollout_anytime: false   -> only the terminal leg got a target
#   rollout_grad_jumps: 1    -> gradient reached only the last jump; every
#                               earlier leg ran under no_grad
#
# So the model was trained to make a good LAST jump, never a good SEQUENCE, and
# then measured at n = 2 where it scored zero acceptance. That is not evidence
# about multi-step decoding; it is evidence about training one pair of a
# two-time family and asking the rest of the square to appear on its own.
#
# THE FOUR CHANGES
#
#   rollout_anytime: true      every leg is asked "if you stopped here, what
#                              would you emit" and matched to p_AR -- the
#                              composition is supervised, not just its end
#   rollout_grad_jumps: 2      gradient flows through the composition itself
#   onpolicy_kl_weight: 1.0    the second jump on the state a REAL decode cycle
#                              produces: verifier-confirmed positions clean at
#                              t = 1, the corrected one clean, the tail after
#                              the break carrying the draft's own rejected guess
#                              at an interior s. Under greedy consensus the
#                              verdict is an argmax comparison of two tensors
#                              the step already holds, so it costs no forward
#                              beyond the one jump it trains.
#   verify_kl_weight: 1.0      UNCHANGED, deliberately. An earlier draft of this
#                              file cut it to 0.5 "to make room" for the
#                              multi-step terms. That is backwards: every cycle
#                              begins at (0,1) however many jumps follow it, so
#                              the first jump fixes the state every later jump
#                              has to work from. Weakening it does not rebalance
#                              the objective, it starves the chain at its root.
#
# EC and TD stay at lambda 0.25. They are what makes a jump from s to t agree
# with the composition of smaller jumps, so under a multi-jump schedule they are
# load-bearing rather than decoration. Turning them off, as an earlier version of
# this file did, contradicts the entire point of carrying a two-time family.
#
# DECODE. Set decode.onpolicy_s to the same value as train.onpolicy_s and the
# next cycle enters from the previous cycle's rejected tail, shifted by
# accepted + 1, instead of from pure noise -- for zero extra forwards, since
# that state is already in hand. Multi-jump schedules run with decode.jumps=2.
#
#   uv run python src/train.py +experiment=flowdraft_multistep
defaults:
  - override /model: qwen3_1.7b

output_dir: checkpoints/flowdraft-multistep

train:
  variant: flowdraft_block_wise
  prior_type: discunif
  block_size: 8
  anchors_per_sequence: 64
  min_prefix: 1
  respect_document_boundaries: true
  lr: 1e-4

  verify_kl_weight: 1.0
  onpolicy_kl_weight: 1.0
  onpolicy_s: 0.5
  rollout_kl_weight: 1.0
  rollout_max_jumps: 2
  rollout_grad_jumps: 2
  rollout_anytime: true
  terminal_time_fraction: 0.25
  endpoint_weight: 0.5
  lambda: 0.25
  lambda_ramp_steps: 2000

  teacher_chain_tail_weight: 0.3
  position_weights: [2.32, 1.75, 1.41, 0.87, 0.39, 0.19, 0.07]
  early_stop_patience: 0
  monitor: val/tpf
  monitor_mode: max
  val_decode_prompts: 128
  val_decode_jumps: 2
  val_decode_max_new: 128
  checkpoint_every_n_steps: 1000
  checkpoint_name: flowdraft-multistep-{step:07d}
  best_checkpoint_name: best-tpf-{step:07d}

data:
  splits: [chat, math, code]
  pack_sequences: true
  pad_to_max_length: true
  train_size: 600000
  batch_size: 2
  max_length: 2048

trainer:
  max_steps: 10000
  accumulate_grad_batches: 32
  val_check_interval: 1000
