# @package _global_
# Boundary-aware, packed-2048 inference-geometry FlowDraft campaign preset.
defaults:
  - override /model: qwen3_1.7b

output_dir: checkpoints/flowdraft-packed-blockwise

train:
  variant: flowdraft_block_wise
  # K = 32 — значение статьи (табл. 4: Parallel Block Size K = 32).
  block_size: 32
  anchors_per_sequence: 4
  min_prefix: 1
  respect_document_boundaries: true
  lr: 1e-4
  verify_kl_weight: 1.0
  endpoint_weight: 0.5
  lambda: 0.25
  lambda_ramp_steps: 2000
  early_stop_patience: 0
  monitor: val/tpf
  monitor_mode: max
  val_decode_prompts: 16
  checkpoint_every_n_steps: 1000
  checkpoint_name: flowdraft-packed-blockwise-{step:07d}
  best_checkpoint_name: best-tpf-{step:07d}

data:
  splits: [chat, math, code]
  pack_sequences: true
  pad_to_max_length: true
  train_size: 600000
  batch_size: 2
  max_length: 2048

trainer:
  # Член TD измеряет конечную разность по t, и под bf16 его отношение
  # сигнал/шум падает до 0.05-0.35 — модель поднимает исключение, а не считает
  # мусор. Пресет включает lambda: 0.25, значит обязан идти в fp32.
  precision: 32
  max_steps: 10000
  accumulate_grad_batches: 32
  # В БАТЧАХ загрузчика, не в шагах оптимизатора: 16000 = каждые 500 шагов.
  # Было 500, то есть валидация каждые 15.6 шага — ~640 валидаций за прогон.
  val_check_interval: 16000
