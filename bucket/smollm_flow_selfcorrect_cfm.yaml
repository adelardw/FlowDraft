# @package _global_
# Та же рука плюс структура CFM: диагональная правдоподобность и две
# консистентности.
#   ... + w_end * CE( x1, pi_{t,t}(x_t) ) + lambda * ( 4*EC + 2*TD )
# Гипотеза: эти члены делают семейство траекторией, а не набором независимых
# отображений, и потому должны платить именно на длинном расписании. На 6000
# шагов знаки переворачивались между сидами — мерялось до сходимости.
#   uv run python src/train.py +experiment=smollm_flow_selfcorrect_cfm
defaults:
  - /experiment/smollm_bench
  - _self_

output_dir: checkpoints/smollm-flow-selfcorrect-cfm
train:
  variant: flowdraft_block_wise
  prior_type: discunif
  verify_kl_weight: 1.0
  endpoint_weight: 0.5
  lambda: 0.25
  lambda_ramp_steps: 500
  terminal_time_fraction: 0.25
  selfcorrect_kl_weight: 1.0
  selfcorrect_rounds: 2
  # Не 0.0: вход ноги есть (1-s)x0' + s*q, и черновик восстановим из него лишь
  # при s > 1/(1+q_max) — это 0.53 при уверенности 0.9 и 0.83 при 0.2. Нижний
  # бин стратификации при s_min=0 лежит ЦЕЛИКОМ ниже порога при любом розыгрыше:
  # там таргет входом не определён, и минимум члена — вход-независимая смесь,
  # то есть ровно та константная карта, против которой член и введён.
  selfcorrect_s_min: 0.5
  selfcorrect_tail_weight: 0.5
