# @package _global_
# Многошаговость, обученная как итерация Якоби к жадной цепочке AR.
#
#   uv run python src/train.py +experiment=flowdraft_selfcorrect
#
# ЧТО ЗДЕСЬ НОВОГО, ОДНОЙ ФРАЗОЙ. Один замороженный AR-форвард по СОБСТВЕННОМУ
# черновику драфтера даёт таргет p_AR(·|ctx, draft_{<j}) и точный жадный
# вердикт; карта учится отвечать из состояния, несущего этот черновик, то, что
# сказал бы верификатор. Если она реализует свип T(ctx,d)_j = argmax
# p_AR(·|ctx,d_{<j}) точно, то n сцепленных прыжков чинят n позиций:
# A_n >= min(n, K-1), при детерминированном верификаторе и без единого нового
# бита. Это делает многошаговость ОСМЫСЛЕННОЙ. Дешёвой она от этого не
# становится: сама гарантия даёт TPF = (min(n,K-1)+1)/(n+1) <= 1, то есть ровно
# скорость AR, а условие окупаемости лишнего прыжка — A_{n+1} - A_n > TPF_n,
# что при A_1 = 3.13 означает A_2 > 5.2 из 7.
#
# ЧТО СТАЛО С rollout_kl. Он делал правильную вещь — ПРОХОДИЛ РАСПИСАНИЕ,
# посещая пары (s,t), которых нет ни у одного другого члена, — но целился в
# корпусный p_AR, то есть в таргет, не зависящий от состояния. selfcorrect
# берёт у него развёртку по расписанию и заменяет таргет на он-полиси свип
# верификатора. Отдельный rollout после этого — вторая оплата одной гипотезы
# с худшим таргетом, поэтому он убран (см. bucket/README.md). Обучать одну
# лишнюю пару вместо расписания было бы двухшаговостью в одной точке: при
# n=3,4 супервизии снова ноль. Отсюда selfcorrect_rounds.
#
# ЧЕГО ЗДЕСЬ НЕТ. Полугруппового члена
# KL(sg[pi_{u,1}(X_{s,u}(x_s))] || pi_{s,1}(x_s)). Его неподвижная точка есть в
# точности «композиция = одиночный прыжок», то есть A_n = A_1 — он ЗАПРЕЩАЕТ
# цель этого пресета. Плюс он вырождается в тавтологию на обоих концах
# (u -> 1 даёт диагональ в пиковом входе, ровно вырожденный EC) и уже сделан:
# семантика flow-map-дистилляции на симплексе словаря — прайор арт.
#
# АРИФМЕТИКА ПРОГОНА, а не пожелание. Эталонный прогон: 41.41 device-часа на
# 2726 шагов при 5 DF + 1 AR и anchors=32, то есть ~54.7 с/шаг. Здесь 8 DF
# (6 с backward) + 3 AR при anchors=64 — это ~2.35x по токен-форвардам, то есть
# ~129 с/шаг и порядка 1100 шагов в 40 GPU-часов. Поэтому max_steps, lambda_ramp_steps и val_check_interval
# ниже согласованы с ДОСТИЖИМЫМ горизонтом: иначе косинус не отжигается (на
# шаге 2726 из 10000 lr держит 87% пика), lambda не доезжает до целевой, а
# валидация случается один раз за прогон.
defaults:
  - override /model: qwen3_1.7b

output_dir: checkpoints/flowdraft-selfcorrect

train:
  variant: flowdraft_block_wise
  prior_type: discunif      # предусловие всей конструкции: при дирихле argmax входа
                            # равен argmax черновика уже при s > 7.4e-5, и второй
                            # прыжок обучается тождественному копированию
  block_size: 8
  anchors_per_sequence: 64
  min_prefix: 1
  respect_document_boundaries: true
  lr: 1e-4

  verify_kl_weight: 1.0     # первый прыжок: каждый цикл начинается в (0,1) сколько бы
                            # прыжков за ним ни шло
  selfcorrect_kl_weight: 1.0
  selfcorrect_rounds: 2     # ноги после первой; расписание рестартов, не одна пара
  selfcorrect_s_min: 0.8    # нога читает (1-s)x0' + s q: при малом s черновик подан
                            # на четверти амплитуды через ЗАМОРОЖЕННЫЙ эмбеддинг, и
                            # доминирует шум приора. У 1 вход есть сам черновик
  selfcorrect_tail_weight: 0.5
  log_train_acceptance: true

  terminal_time_fraction: 0.25
  endpoint_weight: 0.5
  lambda: 0.25
  lambda_ramp_steps: 250    # доезжает внутри достижимого горизонта

  teacher_chain_tail_weight: 0.3   # не 0.0: при tail=0 позиция 7 получает вес ~36 на
                            # 2.8% сэмплов — дисперсионный взрыв
  position_weights: [2.32, 1.75, 1.41, 0.87, 0.39, 0.19, 0.07]  # dE/da_j, а не сырая
                            # кривая выживания S_j: производная равна
                            # (1/a_j) * sum_{k>=j} S_k
  early_stop_patience: 0
  monitor: val/tpf
  monitor_mode: max
  # ОДИН прыжок. Отбор чекпоинтов идёт по этой величине, а декод при jumps=2
  # измерен ровно нулевой приёмкой — селекция по ней весь прогон шла бы по шуму.
  # Многошаговость проверяется отдельным eval-прогоном на отобранных весах:
  #   uv run python src/eval.py checkpoint=... 'decode.jumps=[[0,1],[0.5,1]]'
  val_decode_jumps: 1
  val_decode_prompts: 32
  val_decode_max_new: 64
  checkpoint_every_n_steps: 250
  checkpoint_name: flowdraft-selfcorrect-{step:07d}
  best_checkpoint_name: best-tpf-{step:07d}

data:
  splits: [chat, math, code]
  pack_sequences: true
  pad_to_max_length: true
  train_size: 600000
  batch_size: 2
  max_length: 2048

trainer:
  max_steps: 1100
  accumulate_grad_batches: 32
  val_check_interval: 200
