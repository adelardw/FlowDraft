# @package _global_
# Восьмая рука: та же цель, что у `smollm_flow_selfcorrect`, плюс ГЕЙТ на входе.
#
# Зачем. `verify_kl` считается при s = 0 на случайном розыгрыше приора, и его
# таргет от розыгрыша не зависит — минимум требует, чтобы карта вход ИГНОРИРОВАЛА
# (d(pi)/dx = 0). Член самокоррекции при s >= 0.5 требует, чтобы карта вход
# ЧИТАЛА. Различать режимы сеть может только через s, а s входит ПРИБАВЛЕНИЕМ, и
# сложение якобиан не гейтит.
#
# Замерено на необученной сети: отклик на вход гасится только сдвигами в 81-325
# крат медианной нормы строки эмбеддинга (3.15), а в реальном диапазоне (до 8
# крат) падает лишь до 0.43 от базового. То есть посылка «есть насыщающаяся
# область, достижимая сдвигом» НЕ выполнена, и два члена делят одну ёмкость.
#
# Гейт `g = 1 + h(s,t)` с zero-init `h` умножает вход: на старте ровно единица,
# то есть рука стартует из той же точки, что и негейтованная, и различие
# ИЗМЕРЯЕТСЯ контрастом с ней, а не постулируется.
#   uv run python src/train.py +experiment=smollm_flow_selfcorrect_gate
defaults:
  - /experiment/smollm_flow_selfcorrect
  - _self_

output_dir: checkpoints/smollm-flow-selfcorrect-gate
model:
  adapter:
    conditioning_gate: true
