
defaults:
  - model: qwen3_1.7b
  - data: math500   # default: a dataset NEVER SEEN in training; data=nemotron -> training distribution
  - _self_

seed: 42
checkpoint: null            # path to a FlowDraft/Orthrus .ckpt (DF head only); null = untrained drafter
checkpoint_config: true     # restore saved model/train config and variant; false = use explicit eval config
results_file: results/eval.jsonl   # every run appends a JSON row; plots: uv run python src/plots.py
per_prompt_file: results/eval-prompts.jsonl
run_id: null
experiment_id: null          # stable configuration ID shared across training seeds
split_label: null
lossless_policy: assert       # assert (canonical) | diagnose (throughput audit) | ignore
# Losslessness требует float32 СТВОЛА, а не только trainer.precision. У обеих
# моделей `backbone.dtype: bfloat16`, и 32-битный плагин Lightning параметры
# модуля не поднимает, так что логиты приходят в bf16 при любом значении
# precision. Замерено при K=32, temperature=0: bf16 даёт 5 lossless из 6,
# float32 — 6 из 6, и расхождения у ДВУХ разных драфтеров приходятся на одни
# позиции, то есть это арифметика верификатора на близких значениях, а не
# логика приёмки. Для сравнения рук безвредно (ствол один и тот же у всех), для
# утверждения «декод lossless» — нет. Мерить так:
#   uv run python src/eval.py checkpoint=... model.backbone.dtype=float32
variant: null               # null = infer from checkpoint, otherwise flowdraft when no checkpoint

# Eager is the canonical bitwise-correctness backend. SDPA throughput audits
# override this explicitly and use lossless_policy=diagnose.
model:
  backbone:
    attn_implementation: eager

# Evaluate the complete rendered dataset sample. Individual data configs keep
# max_length for bounded training/validation batches, but that limit must not
# silently shorten standalone benchmark prompts. decode.prompt_len remains the
# explicit opt-in control for prefix-only evaluation.
data:
  truncation: false

# metrics: acceptance / TPF / tokens-per-s + speedup vs greedy AR; lossless is asserted
# K is total width (one anchor + K-1 drafts). Grid example:
# `uv run python src/eval.py -m decode.block_size=4,8,16 decode.jumps=1,2,4`
decode:
  # 32, как в обучении. Было 8: чекпоинт восстанавливает train.block_size, а
  # замер берёт decode.block_size, и карту, обученную на блоке 32, мерили бы на
  # блоке 8 — молча, без единого предупреждения.
  block_size: 32
  fixed_prior: false        # true: start each cycle from the uniform simplex point instead
                            # of a fresh Dirichlet draw -- greedy verification has no
                            # randomness in it, so the draw only adds variance
  jumps: 1                  # int | [times] | [[s,t], ...] -- pairs need not chain,
                            # so [[0,1],[0.5,1]] is "draft, then re-enter at 0.5"
  max_new_tokens: 64
  n_prompts: 64             # acceptance is noisy across prompts: 100-200 for a paper table
  prompt_offset: 0          # skip this many usable prompts (disjoint dev/test slices)
  prompt_len: null          # null = the full rendered prompt (honest bench setting);
                            #   int N = first N tokens only (prefix-continuation mode)
  temperature: 0.0          # 0 = greedy (bitwise lossless); >0 = sampling
  top_k: null               # sampling only
  top_p: null               # sampling only
  coupled: true             # temperature>0: true = Gumbel-coupled sampling — BIT-exact vs AR
                            #   (per the task PDF); false = Leviathan — lossless in distribution
  equiv_samples: 0          # uncoupled sampling only: null-calibrated TV equivalence check
                            #   on the first prompt (e.g. 500 draws); 0 = off

# Prompt sources live in configs/data/. The Orthrus-compatible suite is
# gsm8k, math500, aime24, aime25, humaneval, and mbpp; nemotron measures the
# training distribution. Compose the paper protocol with +benchmark=orthrus.
