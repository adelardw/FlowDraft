# @package _global_
# The configuration four independent reviews and the measurements converge on.
# Every setting below is here because something was measured, not because it
# seemed reasonable.
#
# prior_type=discunif. The reference categorical-flow-map code uses a Gaussian
# or a uniformly-random one-hot prior for text; Dirichlet is this project's
# substitution and it breaks two things at once. At V=151936 the clean token
# becomes the argmax of x_s once s > 7.4e-5, so 99.99% of training samples hand
# the answer to the model and the endpoint/EC/TD terms measure a copy task --
# which is what their near-zero converged values were. And ||x0 @ E|| is 0.004
# against a token embedding's 1.0, so the frozen trunk receives approximately
# the mean embedding: the near-constant behaviour was partly forced by the
# architecture, not only by the objective. A one-hot prior fixes both at once,
# keeping the interpolant a convex combination of two real token embeddings
# along the whole path (0.99 -> 0.72 -> 1.02) and putting the argmax crossing
# at s = 0.5. Gaussian works too but only at 1/sqrt(V); against a frozen
# embedding the one-hot needs no scaling at all.
#
# anchors_per_sequence=64. The baseline supervises 229,376 drafted positions per
# optimizer step; at 32 anchors this supervises 14,336, a 16x deficit that
# confounds every comparison made so far. 128 would be better still but the
# block-wise loss never chunks the KL -- _masked_kl_chunked exists only in
# orthrus.py -- and at batch 2 x 128 anchors x 7 x 151936 in fp32 a single
# logits tensor is 1.09 GB, with five of them live per step plus the backward
# graph. 64 halves that. Raise it after porting the chunked reduction.
#
# val_decode_prompts=128. The pre-registered early signal is the ratio
# val/decode/acceptance_pos_02 / pos_01, currently 0.605, expected to move to
# ~0.63 if the conditioning fix works. At 32 prompts that ratio has sd 0.033 --
# a 1-sigma effect, i.e. unreadable. 128 brings it to ~0.016.
#
# teacher_chain_tail_weight=0 and position_weights on. Isolating the prior was
# the original intent, but the preset already differs from the best previous run
# in prior AND anchors AND decode-eval settings, so it isolates nothing and the
# rationale for holding these back was void. With one run available, carry the
# strongest configuration: position_weights targets the prefix-conjunction
# metric directly, and the chain mask targets the 0.95-token conditioning
# defect, which is the larger of the two measured problems.
#   uv run python src/train.py +experiment=flowdraft_repaired
defaults:
  - override /model: qwen3_1.7b

output_dir: checkpoints/flowdraft-repaired

train:
  variant: flowdraft_block_wise
  prior_type: discunif
  block_size: 8
  anchors_per_sequence: 64
  min_prefix: 1
  respect_document_boundaries: true
  lr: 1e-4
  verify_kl_weight: 1.0
  # The measured failure mode is LABEL coverage, not state distribution. The map
  # is c(ctx, s, t) trained at the single pair (0,1); at (0.5,1) it emits a
  # different constant and acceptance goes to zero. Freezing the state changes
  # nothing measurable, and the transported state's argmax is the first jump's
  # own prediction, so a map reading its input would have scored ~2.3 rather
  # than 0. These two supply the missing pairs: the rollout visits the interior
  # nodes of the deployed schedule, the terminal atom the horizon t = 1.
  rollout_kl_weight: 1.0
  rollout_max_jumps: 2
  rollout_grad_jumps: 1
  rollout_anytime: false
  terminal_time_fraction: 0.25
  endpoint_weight: 0.5
  lambda: 0.25
  lambda_ramp_steps: 2000
  early_stop_patience: 0
  monitor: val/tpf
  monitor_mode: max
  val_decode_prompts: 128
  val_decode_jumps: 2
  val_decode_max_new: 128
  teacher_chain_tail_weight: 0.0
  position_weights: [1.0, 0.882, 0.533, 0.265, 0.153, 0.084, 0.052]
  checkpoint_every_n_steps: 1000
  checkpoint_name: flowdraft-repaired-{step:07d}
  best_checkpoint_name: best-tpf-{step:07d}

data:
  splits: [chat, math, code]
  pack_sequences: true
  pad_to_max_length: true
  train_size: 600000
  batch_size: 2
  max_length: 2048

trainer:
  max_steps: 10000
  accumulate_grad_batches: 32
  val_check_interval: 1000
