# @package _global_
# Тот же главный контраст, но обучаются Q, K, V — БЕЗ O.
#
# Зачем. `qwen06_flowdraft_multistep` обходит воспроизведённый Orthrus на +0.103
# принятых токенов при одном проходе, но у него ЧЕТЫРЕ проекции против трёх у
# бейзлайна. Пока `o_proj` не отключён, нельзя сказать, что даёт преимущество:
# многошаговость или лишняя треть обучаемой головы.
#
# Косвенные доводы противоречат друг другу и потому не заменяют замера. С одной
# стороны, `qwen06_flowdraft` тоже несёт `o_proj` и всё равно ПРОИГРЫВАЕТ
# Orthrus на всех шести наборах (-0.132), то есть сама по себе проекция
# преимущества не даёт. С другой — на SmolLM связка «o_proj + веса позиций +
# вес хвоста» стоила +0.174, и это порядок самого измеряемого эффекта.
#
# Здесь отключается ровно одно: набор проекций. Остальное наследуется, поэтому
# разность с `qwen06_flowdraft_multistep` относится к `o_proj` и ни к чему ещё.
#   uv run python src/train.py +experiment=qwen06_flowdraft_multistep_qkv
defaults:
  - /experiment/qwen06_flowdraft_multistep
  - _self_

output_dir: checkpoints/qwen06_flowdraft_multistep_qkv
model:
  adapter:
    w_names: [q_proj, k_proj, v_proj]
