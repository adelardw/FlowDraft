# @package _global_
# Continuous state with verifier alignment only. The ablation that makes the
# multi-step claim testable: the target of this term does not depend on the
# drafter's state, so nothing here teaches the map to read its own draft.
#
# On the 135M bench this configuration LOSES 0.563 accepted tokens going from one
# refinement pass to four, and does so unpredictably: three seeds gave
# 1.227 / 0.933 / 0.778 at four passes.
#   ./hf-auth.sh uv run python src/train.py +experiment=qwen_flow_baseline
defaults:
  - /experiment/qwen_bench
  - _self_

output_dir: checkpoints/qwen-flow-baseline
train:
  variant: flowdraft_block_wise
  prior_type: discunif
  verify_kl_weight: 1.0
  endpoint_weight: 0.0
  lambda: 0.0
  terminal_time_fraction: 1.0
