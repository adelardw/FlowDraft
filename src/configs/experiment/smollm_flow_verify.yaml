# @package _global_
# Карта потока без самокоррекции: только выравнивание на прыжок, которым декод
# заканчивает цикл.
#   L = KL( sg p_AR || pi_{0,1}(x_0) ) * pos_w
# Абляция: у таргета этого члена ЗНАЧЕНИЕ не зависит от состояния драфтера,
# поэтому чтение состояния здесь не окупается ни при какой ёмкости, и с ростом
# числа прыжков рука обязана деградировать.
#   uv run python src/train.py +experiment=smollm_flow_verify
defaults:
  - /experiment/smollm_bench
  - _self_

output_dir: checkpoints/smollm-flow-verify
train:
  variant: flowdraft_block_wise
  prior_type: discunif
  verify_kl_weight: 1.0
  endpoint_weight: 0.0
  lambda: 0.0
  terminal_time_fraction: 1.0
