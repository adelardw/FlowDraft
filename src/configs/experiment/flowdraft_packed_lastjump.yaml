# @package _global_
# ADDITION (beyond the task): flowdraft_packed_blockwise with the verifier
# alignment moved from the single pair (0, 1) to the whole last-jump family
# pi_{s,1}, s ~ U[0,1). Identical in every other knob, so the pair isolates
# one change: WHICH jumps the AR teacher supervises.
#
# Why: a one-jump schedule calls pi_{0,1}(x_0), but a two-jump schedule
# finishes on pi_{s,1}(x_s) at an intermediate noise level, and nothing
# currently trains that. At s = 0 the input is pure noise carrying nothing
# about x1, so the fixed term supervises the least informative point of the
# family it is meant to align.
#
# Read against flowdraft_packed_blockwise:
#   decode.jumps=1              -- must not regress
#   decode.jumps=[0,0.5,1]      -- should improve (this is what it trains)
#   uv run python src/train.py +experiment=flowdraft_packed_lastjump
defaults:
  - override /model: qwen3_1.7b

output_dir: checkpoints/flowdraft-packed-lastjump

train:
  variant: flowdraft_block_wise
  block_size: 8
  anchors_per_sequence: 4
  min_prefix: 1
  respect_document_boundaries: true
  lr: 1e-4
  verify_kl_weight: 1.0
  verify_s_uniform: true
  endpoint_weight: 0.5
  lambda: 0.25
  lambda_ramp_steps: 2000
  early_stop_patience: 0
  monitor: val/tpf
  monitor_mode: max
  val_decode_prompts: 16
  checkpoint_every_n_steps: 1000
  checkpoint_name: flowdraft-packed-lastjump-{step:07d}
  best_checkpoint_name: best-tpf-{step:07d}

data:
  splits: [chat, math, code]
  pack_sequences: true
  pad_to_max_length: true
  train_size: 600000
  batch_size: 2
  max_length: 2048

trainer:
  max_steps: 10000
  accumulate_grad_batches: 32
  val_check_interval: 500
