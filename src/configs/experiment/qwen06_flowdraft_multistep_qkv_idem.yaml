# @package _global_
# Лучшая ветка стенда плюс член идемпотентности.
#
# Зачем. Цепочка самокоррекции входит только при s ≥ selfcorrect_s_min = 0.5,
# и ниже этой границы карту не надзирает ни один член. Расписание декода с
# точкой входа s = 0.34 стоило на 80 000 шагах −0.733 принятого токена против
# трёхпроходного — больше, чем приносит целый лишний проход. Член требует, чтобы
# зашумлённый верный ответ восстанавливался в себя при любом s.
#
# Отличается от родителя ровно одним весом, поэтому разность с
# `qwen06_flowdraft_multistep_qkv` относится к этому члену и ни к чему ещё.
#   uv run python src/train.py +experiment=qwen06_flowdraft_multistep_qkv_idem
defaults:
  - /experiment/qwen06_flowdraft_multistep_qkv
  - _self_

output_dir: checkpoints/qwen06_flowdraft_multistep_qkv_idem
train:
  # Член живёт в отдельном подклассе, `src/models/flowdraft_idem.py`: проверенный
  # `flowdraft_block_wise.py` не тронут, подкласс вызывает его целиком и только
  # добавляет своё сверху.
  variant: flowdraft_idem
  idem_kl_weight: 1.0
