# @package _global_
# The main result. Continuous state trained on its own refinement procedure:
# the drafter proposes, one frozen forward over that proposal yields both the
# target p_AR(.|ctx, draft) and the exact greedy verdict, and the next pass is
# trained on the restart x_k = (1-s_k) x0' + s_k q_{k-1} that decoding visits.
#
# selfcorrect_s_min is 0.5, not 0: the draft is recoverable from the input only
# above s = 1/(1 + q_max), and the lower stratification bin at s_min=0 sits
# entirely below that threshold, where the term's minimiser is an
# input-independent mixture — the exact degeneracy the term exists to prevent.
#
# On the 135M bench, three seeds: +1.138 +/- 0.109 over the ablation, +0.835
# +/- 0.085 over reproduced Orthrus, and +0.893 growth from one pass to four.
#   ./hf-auth.sh uv run python src/train.py +experiment=qwen_flow_multistep
defaults:
  - /experiment/qwen_bench
  - _self_

output_dir: checkpoints/qwen-flow-multistep
train:
  variant: flowdraft_block_wise
  prior_type: discunif
  verify_kl_weight: 1.0
  endpoint_weight: 0.0
  lambda: 0.0
  terminal_time_fraction: 1.0
  selfcorrect_kl_weight: 1.0
  selfcorrect_rounds: 2
  selfcorrect_s_min: 0.5
  selfcorrect_tail_weight: 0.5
