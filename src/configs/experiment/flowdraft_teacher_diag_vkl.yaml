# @package _global_
# Teacher on the diagonal AND on the last jump, in block geometry.
#
# The original objective anchored pi_{t,t} with KL(p_AR || .) and had no
# endpoint term; it was only ever run full-sequence, where acceptance is 0.000
# under every objective tried, so the geometry and the objective were never
# separated. This preset runs that anchor in the geometry that works, alongside
# the endpoint CE.
#
# Both terms are forward KLs and therefore linear in the target: their weighted
# sum is minimised by the mixture (w_e * p(x1|x_t) + w_a * p_AR) / (w_e + w_a),
# not by a compromise between rivals. The flat blend is wrong at both ends of
# t, so the teacher term decays as (1-t)^1: it leads near t=0, where the input
# carries nothing about x1 and only the teacher knows the clean prefix, and
# vanishes near t=1, where x1 is sharp and correct and where the consistency
# term reads the diagonal as its expert.
#
# Verifier alignment on the last jump is ON here, so this is the diagonal teacher
# added on top of the current recipe. Compare against flowdraft_teacher_diag and
# flowdraft_packed_blockwise to see whether the two placements are complementary.
#   uv run python src/train.py +experiment=flowdraft_teacher_diag_vkl
defaults:
  - override /model: qwen3_1.7b

output_dir: checkpoints/flowdraft-teacher-diag-vkl

train:
  variant: flowdraft_block_wise
  block_size: 8
  anchors_per_sequence: 4
  min_prefix: 1
  respect_document_boundaries: true
  lr: 1e-4
  verify_kl_weight: 1.0
  ar_kl_weight: 1.0
  ar_kl_t_decay: 1.0
  endpoint_weight: 0.5
  lambda: 0.25
  lambda_ramp_steps: 2000
  early_stop_patience: 0
  monitor: val/tpf
  monitor_mode: max
  val_decode_prompts: 16
  checkpoint_every_n_steps: 1000
  checkpoint_name: flowdraft-teacher-diag-vkl-{step:07d}
  best_checkpoint_name: best-tpf-{step:07d}

data:
  splits: [chat, math, code]
  pack_sequences: true
  pad_to_max_length: true
  train_size: 600000
  batch_size: 2
  max_length: 2048

trainer:
  max_steps: 10000
  accumulate_grad_batches: 32
  val_check_interval: 500
