# @package _global_
# Контроль на профиль весов ВНУТРИ члена самокоррекции, зеркальный к
# `smollm_flow_selfcorrect_prefixweight`: tail = 1.0 снимает приглушение, и
# каждая позиция блока весит одинаково.
# Аргумент правки: на принятом префиксе argmax таргета совпадает с токеном,
# лежащим в слоте входа (форвард двунаправлен), там член почти всегда прав и
# несёт мало градиента; информативна ровно позиция разрыва. Если эта рука не
# хуже, правка была косметикой. Две такие руки, по одной на ветвь, дают контроль
# на ОДНУ ось в обеих — чего пара «вычеркнуто против приглушено» не давала.
#   uv run python src/train.py +experiment=smollm_masked_selfcorrect_prefixweight
defaults:
  - /experiment/smollm_bench
  - _self_

output_dir: checkpoints/smollm-masked-selfcorrect-prefixweight
train:
  variant: orthrus
  selfcorrect_kl_weight: 1.0
  selfcorrect_rounds: 2
  selfcorrect_tail_weight: 1.0
