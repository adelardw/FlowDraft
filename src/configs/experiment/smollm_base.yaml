# @package _global_
# Общая часть стенда SmolLM2-135M. Сама по себе конфигурацией не является: задаёт то,
# что у всех конфигураций обязано совпадать, чтобы контраст между ними читался.
#
# Веса позиций стоят ЗДЕСЬ, а не в отдельных конфигурациях. dE/da_j — свойство метрики
# (приёмка есть конъюнкция по префиксу), а не свойство ветви. Пока они стояли
# только у симплексных конфигураций, контраст «состояние» содержал внутри себя контраст
# «веса против без весов», и вывод о ветвях из него не следовал.
#
# Задаётся приёмка, а веса из неё выводятся точно: dE/da_j = S_{j-1}(1 + R_j).
# Прежний жёсткий список [2.32, 1.75, ...] был нормирован на S_1 = 1, то есть
# молча предполагал a_1 = 1, отчего первая позиция занижалась в 1/a_1.
#
# Значение 0.9 — это РЕЖИМ, В КОТОРЫЙ МЫ ЦЕЛИМСЯ, а не измеренный на стенде.
# Так сделано сознательно. Измеренная на K=8 приёмка (a_1 = 0.525, дальше около
# 0.6) при растяжении на 31 позицию отдаёт позициям 8..31 лишь 2.75% всей массы
# веса, а первой — 13.9 средних: блок из 32 обучался бы как блок из 8, и
# многошаговости было бы негде проявиться. Это замороженный профиль, запирающий
# драфтер в том режиме приёмки, где его мерили. Внешняя опора для 0.9 есть:
# 0.8 — ПРИОР, а не измерение, и это надо держать в уме при разборе.
#
# Профиль верен только там, где угадана приёмка. Доля массы на позициях 8..31
# против их истинного вклада в E[len]:
#     профиль 0.607 (замерено на K=8): масса 3.0%,  при a=0.8 недокорм в 10 раз
#     профиль 0.800:                   масса 20.5%, при a=0.8 ровно 1.0x
#     профиль 0.935 (опора Orthrus):   масса 49.0%, при a=0.607 перекорм 16x
# Ошибка в сторону агрессии хуже, чем кажется: приёмка есть конъюнкция, и
# улучшение первой позиции умножает все последующие. Отдавая половину градиента
# в хвост, недокармливаешь ровно те позиции, через которые хвост и достижим.
# 0.935 взято у Qwen3-8B, модели в шестьдесят раз крупнее нашей, и оснований
# переносить это число на 135M нет. 0.607 запирает потолок блока: хвост получает
# 3% и K=32 работает как K=8.
#
# Попозиционная приёмка логируется на каждой валидации, поэтому после прогона
# это число можно ПОСЧИТАТЬ из данных, а не выбирать.
#
# precision: 32 — про оптимизатор и градиенты, НЕ про логиты: `backbone.dtype`
# у обеих моделей bfloat16, и 32-битный плагин Lightning параметры модуля не
# поднимает, так что логиты приходят в bf16 при любом значении. Расхождение
# верхних коммитов между обучением и декодом чинится не этим ключом, а тем,
# что уверенность и там и там берётся через .float().
defaults:
  - override /model: smollm2_135m

train:
  # K = 32, как в статье (табл. 4). Прежние 8 занижали всю шкалу TPF: статья
  # отдельно отмечает, что переход к K = 32 даёт 3.6x пропускной способности
  # против K = 4. На стенде это стоит 0.41 с/шаг против 0.30 и 1.89 ГБ памяти
  # против 1.63 — замерено, не оценено.
  block_size: 32
  anchors_per_sequence: 1
  lr: 3e-4
  teacher_chain_tail_weight: 0.3
  acceptance_profile: [0.8]     # растягивается повтором на все K-1 позиций
  checkpoint_every_n_steps: 2000
  checkpoint_name: snap-{step:07d}
  monitor: val/tpf
  monitor_mode: max
  early_stop_patience: 5
  # Расписание валидации задано ПАРАМИ РЕСТАРТА, а не числом прыжков. Целое 3
  # раскрывается в [(0,1/3),(1/3,2/3),(2/3,1)], то есть два шага уточнения из трёх идут
  # при t<1 — а при endpoint_weight=0 и lambda=0 ни одна пара с t<1 не получает
  # градиента вовсе. Отбор чекпоинта шёл бы по расписанию, которого симплексная
  # конфигурация не видела, тогда как у маскирующей совпадение точное: контраст ветвей
  # содержал бы внутри себя контраст «обучено в рабочей точке против нет».
  # Пары (s,1) — ровно то, что учит член самокоррекции.
  # 30, а не 60: после подъёма val_decode_max_new до 128 (четыре цикла вместо
  # одного) валидация подорожала вчетверо, и на десяти точках 60 промптов
  # стоили бы 7.1 ч на девять конфигураций против 3.5 ч на тридцати. Десять точек важнее
  # шестидесяти промптов: траекторию по горизонту тридцатью промптами видно, а
  # строгий замер всё равно делается отдельно на 24 промптах x 5 сидов.
  val_decode_prompts: 30
  val_decode_datasets: [gsm8k, math500, humaneval, mbpp, aime24, aime25]
  val_decode_jumps: [[0.0, 1.0], [0.5, 1.0], [0.75, 1.0]]
  # 128, а не 32: при K=32 тридцати двух новых токенов хватает ровно на ОДИН
  # цикл декода, и приёмка мерилась бы по одному блоку на промпт. Четыре цикла
  # — минимум, при котором видно, как состояние переносится между циклами, а
  # не только внутри блока.
  val_decode_max_new: 128

data:
  batch_size: 2
  max_length: 256
  val_size: 8
  shuffle_buffer: 64

trainer:
  max_steps: 20000
  # accumulate_grad_batches = 1, поэтому здесь батчи загрузчика и шаги
  # оптимизатора — одно и то же, и 2000 действительно даёт 10 валидаций.
  val_check_interval: 2000
  precision: 32
  log_every_n_steps: 200
