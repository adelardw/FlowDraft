# @package _global_
# Основное утверждение: карта потока, обученная собственной многошаговости.
#   L = w_verify * KL( sg p_AR || pi_{0,1}(x_0) ) * pos_w
#     + w_self * (1/r) sum_k l( p_AR(.|ctx, argmax q_{k-1}), pi_{s_k,1}(x_k) ) * v_j * pos_w
# q_0 = pi_{0,1}(x_0) — прыжок, который исполняет декод;
# x_k = (1-s_k) x_0' + s_k q_{k-1} — рестарт, несущий черновик прошлой ноги;
# s_k стратифицированы в (s_min, 1), между раундами detach.
# В отличие от маскирующей ветви времена входа РАСПРЕДЕЛЕНЫ, а не фиксированы:
# непрерывное состояние это позволяет, маска — нет.
#   uv run python src/train.py +experiment=smollm_flow_selfcorrect
defaults:
  - /experiment/smollm_bench
  - _self_

output_dir: checkpoints/smollm-flow-selfcorrect
train:
  variant: flowdraft_block_wise
  prior_type: discunif
  verify_kl_weight: 1.0
  endpoint_weight: 0.0
  lambda: 0.0
  terminal_time_fraction: 1.0
  selfcorrect_kl_weight: 1.0
  selfcorrect_rounds: 2
  # Не 0.0: вход ноги есть (1-s)x0' + s*q, и черновик восстановим из него лишь
  # при s > 1/(1+q_max) — это 0.53 при уверенности 0.9 и 0.83 при 0.2. Нижний
  # бин стратификации при s_min=0 лежит ЦЕЛИКОМ ниже порога при любом розыгрыше:
  # там таргет входом не определён, и минимум члена — вход-независимая смесь,
  # то есть ровно та константная карта, против которой член и введён.
  selfcorrect_s_min: 0.5
  selfcorrect_tail_weight: 0.5
