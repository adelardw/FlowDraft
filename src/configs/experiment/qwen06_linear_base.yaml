# @package _global_
# Общая часть кампаний LinearOrthrus на Qwen3-0.6B. Сама по себе конфигурацией
# не является: её подключают `qwen06_orthrus_qkvo_linear` и
# `qwen06_flowdraft_multistep_linear`, чтобы план линеаризации у обеих веток был
# один и тот же и сравнение «полный против гибридного» читалось одинаково.
#
# План — какие компоненты диффузионного вида заменены на W x + b (attn —
# внимание, mlp — MLP, attn+mlp — оба, layer — слой целиком). Выбран без
# обучения: по одиночным заменам на обученных 0.6B (Orthrus и многошаговая qkv,
# 80k) взяты компоненты, в среднем дешёвые у обоих драфтеров, пока проход
# драфтера не начал читать 74.5% весов полного прохода
# (`tools/mixed_linearization_probe.py`, docs/comparisons.md, C12). Жадный путь
# одной модели здесь не годится: на 40 состояниях он подгоняется под шум.
#
# Вес дистилляции — при относительной квадратичной ошибке, одинаковой по
# масштабу во всех слоях.
train:
  linearize: ["0:mlp", "1:layer", "2:attn", "3:attn", "4:attn", "5:mlp", "6:layer",
              "7:attn+mlp", "9:attn+mlp", "10:attn", "11:attn", "12:layer", "13:attn",
              "15:attn", "16:attn", "19:attn", "20:mlp", "27:mlp"]
  linear_distill_weight: 1.0
