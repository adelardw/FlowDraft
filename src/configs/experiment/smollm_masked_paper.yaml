# @package _global_
# Бейзлайн ТОЧНО ПО СТАТЬЕ (arXiv 2605.12825), без единого нашего добавления.
#
# Зачем отдельная рука. `smollm_masked_baseline` несёт три вещи, которых в
# статье нет: обучаемую выходную проекцию `o_proj` (+37.5% головы), веса позиций
# dE/da_j и гейт согласованности цепочки (tail=0.3). Все три должны делать его
# СИЛЬНЕЕ опубликованного, и побеждать усиленный бейзлайн честнее. Но веса и
# гейт — наши изобретения, и помогают ли они, никто не измерял. Если вредят,
# наш «бейзлайн» слабее опубликованного, и победа над ним ничего не стоит.
# Эта рука отвечает на вопрос прямо, и она же — единственная точка, в которой
# наши числа сопоставимы с числами статьи.
#
# Что взято из статьи дословно (разд. 3 и табл. 4): проекции W_Q, W_K, W_V;
# K = 32; forward KL (soft), у них 86.2% / TPF 6.35 против 86.2% / 5.86 у hard
# CE; одношаговая проекция блока.
#   uv run python src/train.py +experiment=smollm_masked_paper
defaults:
  - /experiment/smollm_bench
  - _self_

output_dir: checkpoints/smollm-masked-paper
model:
  adapter:
    w_names: [q_proj, k_proj, v_proj]
train:
  variant: orthrus
  teacher_target: soft
  acceptance_profile: null        # статья не взвешивает позиции
  position_weights: null
  teacher_chain_tail_weight: 1.0  # статья не гейтирует учителя по цепочке
