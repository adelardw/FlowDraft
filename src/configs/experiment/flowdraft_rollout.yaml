# @package _global_
# Rollout: supervise the drafter on its OWN multi-jump path, in block geometry.
#
# Every other term is evaluated on the interpolation path x_s = (1-s) x0 + s x1,
# which is constructed from the answer. Decoding never walks that path: it
# starts at the prior and feeds each step the previous step's own output. This
# is the same exposure mismatch teacher forcing creates in an AR model, and no
# term of the objective addressed it.
#
# It also gives the composition a direct signal. Endpoint consistency relates
# pi_{s,t} to the diagonal pairwise; an n-jump schedule executes a composition
# that no pairwise term ever evaluates end to end, so accumulated error was
# unconstrained. This is what should make jumps > 1 worth its extra pass.
#
# n ~ U{1..8} per step so no single schedule is specialised for; gradients flow
# through the last 4 jumps, earlier ones under no_grad, so memory follows the
# window rather than the schedule. Each step in the window is supervised as
# "if you stopped here" -- pi_{s_k,1} against the frozen AR path -- which is the
# map any schedule terminates on. Supervising the intermediate horizons instead
# would push the family towards independence of t.
#
# Read against flowdraft_packed_blockwise at decode.jumps = 1, 2 and 4: the
# one-jump number must not regress, and the multi-jump numbers are the point.
#   uv run python src/train.py +experiment=flowdraft_rollout
defaults:
  - override /model: qwen3_1.7b

output_dir: checkpoints/flowdraft-rollout

train:
  variant: flowdraft_block_wise
  block_size: 8
  anchors_per_sequence: 4
  min_prefix: 1
  respect_document_boundaries: true
  lr: 1e-4
  verify_kl_weight: 1.0
  rollout_kl_weight: 1.0
  rollout_max_jumps: 8
  rollout_grad_jumps: 4
  rollout_anytime: true
  endpoint_weight: 0.5
  lambda: 0.25
  lambda_ramp_steps: 2000
  early_stop_patience: 0
  monitor: val/tpf
  monitor_mode: max
  val_decode_prompts: 16
  checkpoint_every_n_steps: 1000
  checkpoint_name: flowdraft-rollout-{step:07d}
  best_checkpoint_name: best-tpf-{step:07d}

data:
  splits: [chat, math, code]
  pack_sequences: true
  pad_to_max_length: true
  train_size: 600000
  batch_size: 2
  max_length: 2048

trainer:
  max_steps: 10000
  accumulate_grad_batches: 32
  val_check_interval: 500
