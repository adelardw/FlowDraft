# Entrypoint config for src/train.py  →  @hydra.main(config_name="train")
# Compose: `uv run python src/train.py`
# Override:  `uv run python src/train.py model=qwen2_0.5b seed=0`

defaults:
  - model: qwen3_1.7b
  - data: nemotron  # training distribution (см. configs/data/)
  - _self_          # keep last so values below override the groups above

seed: 42
output_dir: checkpoints     # artifacts live at project root, gitignored
# Lightning resume checkpoint. Unlike evaluation's `checkpoint`, this restores
# model, AdamW, scheduler, global step, and callback state.
resume_from_checkpoint: null

# TensorBoard is always written locally. Enable W&B to mirror the same
# Lightning metrics; authenticate with `uv run wandb login` or WANDB_API_KEY.
wandb:
  enabled: false
  project: flowdraft
  entity: null              # W&B team/user; null uses the CLI/env default
  name: null                # run display name; null lets W&B generate one
  group: null               # optional experiment/ablation group
  tags: []
  offline: false            # true writes a local run for a later `wandb sync`

# --- training (FlowDraft.configure_optimizers) ---
train:
  variant: flowdraft        # Canonical variants:
                            #   flowdraft | flowdraft_block_wise
                            #   orthrus
                            # Presets (see configs/experiment/):
                            #   `+experiment=flowdraft_staged|orthrus|ablate_*`
                            #   `+experiment=flowdraft_block_wise`
  block_size: 64            # total K: one clean anchor + K-1 drafted positions
  anchors_per_sequence: 1   # block-wise FlowDraft can flatten multiple isolated
                            # width-K blocks into one DF pass; Orthrus uses 256
  min_prefix: 1             # block-wise only: shortest clean prefix
  respect_document_boundaries: true  # packed training: isolate DF documents / reject crossing blocks
  lr: 1e-4                  # peak LR (the Orthrus paper uses 2e-4 at global batch 128x2048)
  lr_schedule: cosine       # cosine (linear warmup -> cosine decay to 0, needs a finite
                            #   trainer.max_steps or limit_train_batches+max_epochs) | constant
  warmup_ratio: 0.05        # cosine only: fraction of total steps spent warming up
  weight_decay: 0.01
  betas: [0.9, 0.95]
  prior_type: dirichlet     # x0 in x_s = (1-s) x0 + s x1. Decides whether the input hides
                            # the answer. At V=151936 the clean token becomes the argmax of
                            # x_s at s* = 7.4e-5 (dirichlet), 0.500 (discunif), 0.815
                            # (gaussian) -- so the share of t~U[0,1] with a genuinely
                            # ambiguous input is 0.007%, 50% and 81%. The reference CFM text
                            # configs use gaussian; dirichlet is this project's substitution
                            # and is why the endpoint/EC/TD terms converge to near zero.
                            # gaussian leaves the simplex: the interpolant is then a point in
                            # R^V, which x @ E and x + gamma(pi - x) both accept.
                            # SCALE matters here because the input projection is the FROZEN
                            # embedding matrix, not a trained Linear as in the reference.
                            # Measured at V=151936 against a token embedding's norm of 1.0,
                            # ||x0 @ E|| is 0.004 for dirichlet -- 270x too small, so the trunk
                            # sees essentially the mean embedding, which pushes the map toward
                            # behaving as a constant -- 1.00 for discunif, and 392 for an
                            # unscaled Gaussian. gaussian is therefore emitted at 1/sqrt(V).
                            # discunif needs no scaling and is the safer choice here.
  time_sampling: paper      # paper: t~U[0,1], s~U[0,t] | triangle (uniform on {s<=t})
                            #   | sequential (s~U, t~U[s,1]) | log (both log-uniform)
                            # The clean token is the argmax of x_s once s > 1e-4 and is
                            # linearly readable from its embedding once s > 2.6e-3, so on a
                            # linear scale ~98% of samples train a copy task. Coverage below
                            # s=1e-2: paper 5.7%, triangle 2.0%, sequential 1.0%, log ~50%.
  time_min: 1.0e-5          # log mode only: lower end of the range for both s and t
  lambda: 1.0               # weight of the ECLD part:
                            #   loss = verify_kl_weight*verify_kl
                            #        + endpoint_weight*endpoint
                            #        + lambda*(4*EC + 2*TD)
  endpoint_weight: 1.0      # categorical VFM diagonal CE; 0 = consistency-only ablation
  teacher_target: soft      # how every teacher term matches p_AR. The two verification
                            # rules read different things, so the metric-matched loss
                            # differs by decoding mode -- and they disagree: a blurred
                            # proposal is rejected by greedy yet accepted ~94% of the time
                            # by sampling, a peaked one the reverse.
                            #   soft -- KL(p_AR || pi). Surrogate for both, matched to
                            #           neither; safe default.
                            #   hard -- CE(argmax p_AR, pi). Greedy accepts iff the modes
                            #           agree, so this targets the criterion directly. Use
                            #           when decoding at temperature 0.
                            #   tv   -- total variation. Speculative sampling accepts with
                            #           probability sum(min(p, q)) = 1 - TV, so this IS the
                            #           acceptance rate. Use when decoding with sampling.
                            # None of them affects output quality: verification makes the
                            # text identical to the AR model's either way. Only speed moves.
  teacher_chain_tail_weight: 1.0  # Acceptance is judged against p_AR conditioned on the
                            # tokens already ACCEPTED, i.e. under greedy verification the
                            # frozen model's own greedy chain. The single AR pass conditions
                            # on the CORPUS tokens instead, and the two agree only until the
                            # model's top-1 first differs from the data -- about two positions
                            # at ~55% agreement. This scales the teacher terms past that point:
                            # 1.0 = previous behaviour, 0.0 = hard mask, in between trades bias
                            # for keeping the deep positions from starving. Costs no forwards.
  position_weights: null    # per-position weights for the teacher terms, e.g. the measured
                            # prefix-survival curve [1, 0.882, 0.533, 0.265, 0.153, 0.084, 0.052].
                            # TPF is a conjunction over the prefix, so position j is worth the
                            # probability of reaching it; uniform weighting spends most of the
                            # gradient past position 4, reached on a few percent of blocks.
                            # Normalised to mean 1, so it does not change the effective LR.
  verify_kl_weight: 0.0     # KL(p_AR || pi_{0,1}(x_0)) on the pure prior -- the exact
                            # state the decode loop enters every cycle at; the packed
                            # block-wise preset enables it

  lambda_ramp_steps: 0      # staged CFM training: ramp lambda 0 -> lambda over N steps
                            #   (diagonal endpoint inference first, consistency second); 0 = static
  checkpoint_name: flowdraft-{step:07d}   # ModelCheckpoint filename pattern
  anchor_point: trajectory  # where endpoint inference evaluates the diagonal pi_{t,t}:
                            #   trajectory --> pi_{t,t}(x_t) | landing (X_{s,t}(x_s)) --> pi_{t,t}(X_{s,t}(x_s))
  checkpoint_every_n_steps: 1000  # unconditional recovery snapshots; optimizer steps, not batches
  checkpoint_save_top_k: 2        # number of best validation-metric checkpoints to retain
  best_checkpoint_name: best-tpf-{step:07d}
  final_checkpoint_name: last.ckpt  # always overwritten with the true terminal state
  # Target-metric validation: run the real decode loop (single-jump) on a few
  # val prompts each validation -> val/tpf & val/acceptance_decode curves.
  val_decode_prompts: 2     # 0 = off; raise (8+) if checkpoint selection looks noisy
  val_decode_max_new: 32
  monitor: val/tpf          # checkpoint selection: val/tpf (beat the baseline on the
  monitor_mode: max         #   target metric; NOISY early) | val/loss + min (smooth)
  early_stop_patience: 5    # stop if val/loss fails to improve N validations in a row; 0 = off

# Lightning Trainer kwargs, passed through verbatim (см. src/train.py)
trainer:
  accelerator: auto
  devices: auto
  strategy: auto             # auto selects DDP when multiple GPU devices are requested
  precision: bf16-mixed
  max_steps: 10000            # -1 = no step bound (then bound by max_epochs)
  max_epochs: null            # repetitions of the stream; see "Повторение потока" in README
  limit_train_batches: null   # batches per repetition; null = the whole stream
  val_check_interval: 500
  log_every_n_steps: 10
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1

# data.* lives in configs/data/ (defaults: nemotron); override fields inline:
#   `uv run python src/train.py data.batch_size=8 data.max_length=1024`
# block_size / jump_count are method knobs (ablated per the slides)
