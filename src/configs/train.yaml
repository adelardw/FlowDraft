# Entrypoint for src/train.py.  `uv run python src/train.py [+experiment=...]`
# Rationale for the objective lives in the model docstrings, not here.

defaults:
  - model: qwen3_1.7b
  - data: nemotron
  - _self_

seed: 42
output_dir: checkpoints
resume_from_checkpoint: null   # Lightning resume: model + optimizer + step

wandb:
  enabled: false
  project: flowdraft
  entity: null
  name: null
  group: null
  tags: []
  offline: false

train:
  variant: flowdraft            # flowdraft | flowdraft_block_wise | orthrus
  block_size: 64                # K = one clean anchor + K-1 drafted positions
  anchors_per_sequence: 1       # block-wise: isolated blocks per DF pass (Orthrus uses 256)
  min_prefix: 1
  respect_document_boundaries: true   # constrains ANCHOR SELECTION only. The
                                # block-wise attention still reads the whole AR
                                # prefix through earlier documents, exactly as
                                # the masked baseline does -- both arms share the
                                # convention, so it is not a comparison defect

  lr: 1e-4
  lr_schedule: cosine           # cosine (needs a finite max_steps) | constant
  warmup_ratio: 0.05
  weight_decay: 0.01
  betas: [0.9, 0.95]

  # --- trajectory ---------------------------------------------------------
  # prior_type decides whether x_s = (1-s)x0 + s x1 hides the answer. At
  # V=151936 the clean token becomes the argmax of x_s once s exceeds 7.4e-5
  # under dirichlet, 0.5 under discunif, 0.815 under gaussian. dirichlet is
  # this project's substitution and is kept only to reproduce older runs.
  prior_type: discunif          # discunif | gaussian | dirichlet
  time_sampling: paper          # paper: t~U[0,1], s~U[0,t] | triangle | sequential
  terminal_time_fraction: 0.0   # share of the batch forced onto t = 1, the only
                                # pair the decode loop executes
  anchor_point: trajectory      # diagonal input: trajectory pi_{t,t}(x_t) | landing
  gamma_clamp: 1.0e-4           # floor on (1-s) in gamma = (t-s)/(1-s)
  td_min_step: 0.01             # minimum finite-difference probe for the drift term

  # --- objective ----------------------------------------------------------
  #   loss = verify_kl_weight   * KL(p_AR || pi_{0,1}(x0))
  #        + selfcorrect_kl_w   * KL(p_AR(.|draft) || pi_{s,1}(x_s carrying draft))
  #        + endpoint_weight    * CE(x1, pi_{t,t})
  #        + lambda * (4*EC + 2*TD)
  verify_kl_weight: 0.0
  selfcorrect_kl_weight: 0.0    # the multi-step term: walks the jump schedule, each
                                # leg supervised by the AR sweep of the leg before it
  selfcorrect_rounds: 2         # legs after the first; costs r DF + (r-1) AR forwards
  selfcorrect_s_min: 0.0        # entry times stratified in (s_min, 1). The leg reads
                                # (1-s)x0' + s q, so s near 1 hands it the draft itself
                                # -- the Jacobi operator -- and s near 0 buries the draft
                                # under prior noise at a frozen embedding
  selfcorrect_tail_weight: 0.5  # trust in positions past the verifier's break
  endpoint_weight: 1.0
  lambda: 1.0                   # ECLD weight
  lambda_ramp_steps: 0          # ramp lambda 0 -> lambda over N steps; 0 = static

  teacher_target: soft          # soft KL | hard CE(argmax) | tv (= sampled acceptance)
  teacher_source: corpus        # what p_AR is conditioned on. corpus = the packed
                                # sequence, valid only until the greedy chain diverges
                                # from the data (~2 positions). onpolicy = the AR sweep
                                # over the drafter's own block, EXACT up to the verifier's
                                # break and corpus-conditioned beyond it. Costs one AR
                                # forward, free once a self-correction term is on.
  teacher_chain_tail_weight: 1.0  # weight past the first divergence of the greedy
                                # chain from the corpus; 1.0 = off, 0.0 = hard mask
  position_weights: null        # per-position dE/da_j, e.g. [2.32, 1.75, 1.41, 0.87,
                                # 0.39, 0.19, 0.07]; normalised to mean 1
  log_train_acceptance: false   # exact greedy acceptance every step (free once any
                                # on-policy term is on, one AR forward otherwise)

  # --- checkpointing / validation ----------------------------------------
  checkpoint_name: flowdraft-{step:07d}
  best_checkpoint_name: best-tpf-{step:07d}
  final_checkpoint_name: last.ckpt
  checkpoint_every_n_steps: 1000
  checkpoint_save_top_k: 2
  monitor: val/tpf              # val/tpf (target metric, noisy) | val/loss + min
  monitor_mode: max
  early_stop_patience: 5        # validations without val/loss improvement; 0 = off
  val_decode_prompts: 2         # real decode loop on N val prompts; 0 = off
  val_decode_max_new: 32
  val_decode_jumps: 1           # schedule validation decodes with; int, [times],
                                # or [[s,t],...]. monitor: val/tpf selects on THIS

trainer:
  accelerator: auto
  devices: auto
  strategy: auto
  precision: bf16-mixed
  max_steps: 10000
  max_epochs: null
  limit_train_batches: null
  val_check_interval: 500
  log_every_n_steps: 10
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
